# Continuous Integration — the merge gate. Runs on every pull request (and on pushes to main) so "green"
# actually means something: the TypeScript compiles with no errors AND the full test suite passes. This is
# the prerequisite for ever auto-merging AI-written implementation PRs — without it, a PR with no checks is
# vacuously "green". Fast + hermetic: no app env, no network, no DB file (tests use an in-memory SQLite).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
