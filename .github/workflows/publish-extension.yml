# Auto-publish the Auto-Pull browser extension to the Chrome Web Store on a version bump.
#
# WHY: a Chrome extension only reaches installed browsers (yours, Lisa's, the office machine) once a new
# version is LIVE on the Web Store — then Chrome auto-updates everyone within hours, with no manual reload.
# The one manual step was uploading + publishing to the store. This workflow removes it: merge a version bump
# to main and the new build goes to the store automatically.
#
# GOVERNANCE: publishing is outward-facing (it pushes code to every installed browser), so it is gated behind
# a MERGED PR plus a DELIBERATE version bump in extension/manifest.json. It is also idempotent — after a
# successful publish it tags the commit `ext-v<version>`, and it never publishes a version whose tag already
# exists. Until the four Chrome Web Store secrets are set it is completely inert (skips with a log line).
#
# ONE-TIME SETUP: see docs/chrome-extension-autopublish.md. You add four repo secrets: CWS_CLIENT_ID,
# CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_EXTENSION_ID.

name: Publish extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "scripts/build-extension.mjs"
      - ".github/workflows/publish-extension.yml"
  pull_request:
    # The bump guard is about SHIPPED CONTENT, so it keys off extension/ only — a change to the build script
    # or the workflow itself must not demand a version bump.
    paths:
      - "extension/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the ext-v<version> tag already exists (re-publish current version)"
        type: boolean
        default: false

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  # PR gate: if the extension source changed but the manifest version did NOT, fail. A same-version change
  # would be skipped by the publisher (tag already exists) and the Web Store rejects re-uploading an existing
  # version anyway — so forgetting the bump must be caught before merge, not discovered after.
  version-bump-guard:
    if: github.event_name == 'pull_request'
    name: Require a version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check manifest version bumped when extension/ changed
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" -q
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD" -- extension || true)
          if [ -z "$CHANGED" ]; then
            echo "No extension/ content changes in this PR — nothing to guard."
            exit 0
          fi
          HEAD_V=$(node -p "require('./extension/manifest.json').version")
          BASE_V=$(git show "$BASE:extension/manifest.json" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "manifest version: base=$BASE_V head=$HEAD_V"
          if [ "$HEAD_V" = "$BASE_V" ]; then
            echo "::error::extension/ changed but extension/manifest.json version is still $HEAD_V. Bump it so the Chrome Web Store accepts the update and the auto-publisher fires."
            exit 1
          fi
          echo "Version bumped $BASE_V -> $HEAD_V. OK."

  publish:
    if: github.event_name != 'pull_request'
    name: Upload + publish to Chrome Web Store
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the ext-v<version> tag
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish (secrets present + version not already tagged)
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${CWS_CLIENT_ID}" ] || [ -z "${CWS_CLIENT_SECRET}" ] || [ -z "${CWS_REFRESH_TOKEN}" ] || [ -z "${CWS_EXTENSION_ID}" ]; then
            echo "Chrome Web Store secrets are not set — skipping publish (workflow is inert until configured)."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(node -p "require('./extension/manifest.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/ext-v$V" >/dev/null; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "ext-v$V tag exists, but force=true — re-publishing."
              echo "go=true" >> "$GITHUB_OUTPUT"
            else
              echo "ext-v$V already published (tag exists) — nothing to do."
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ext-v$V not yet published — will publish."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the keyless store zip
        if: steps.gate.outputs.go == 'true'
        run: node scripts/build-extension.mjs --store --out dist/zoe-autopull-extension.store.zip

      - name: Upload + publish
        if: steps.gate.outputs.go == 'true'
        # The CLI reads credentials from these exact env names; --auto-publish submits for publishing (an
        # unlisted item stays unlisted — existing installs still auto-update).
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@3 upload --source dist/zoe-autopull-extension.store.zip --auto-publish

      - name: Tag the published version
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.gate.outputs.version }}"
          git tag -f "ext-v$V"
          git push -f origin "ext-v$V"
          echo "Tagged ext-v$V."
