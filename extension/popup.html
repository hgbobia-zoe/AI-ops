<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zoe Auto-Pull</title>
  <style>
    body { font: 13px/1.45 system-ui, sans-serif; margin: 0; width: 260px; background: #0b0b0c; color: #e7e7e9; }
    .wrap { padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .status { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; background: #141416; border: 1px solid #2a2a30; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .meta { color: #9a9aa2; font-size: 11.5px; margin-top: 8px; }
    .btns { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 8px 10px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #26262c; color: #e7e7e9; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Zoe Auto-Pull</h1>
    <div class="status"><span id="dot" class="dot" style="background:#6b7280"></span><span id="label">Checking…</span></div>
    <div id="meta" class="meta"></div>
    <div class="btns">
      <button id="pull">Pull now</button>
      <button id="opts" class="secondary">Settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
