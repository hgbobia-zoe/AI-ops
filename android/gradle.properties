# Project-wide Gradle settings.

# Give the Gradle daemon enough heap for AGP + R8.
# preferIPv4Stack avoids "Unable to establish loopback connection" on hosts where
# the worker daemon can't bind the IPv6 loopback.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Run subprojects in parallel and cache task outputs — faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required; Jetifier is not (no legacy support-lib deps).
android.useAndroidX=true
android.enableJetifier=false

# Kotlin official code style.
kotlin.code.style=official

# Only generate the resources/BuildConfig we use.
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
